repos:
  - repo: https://mirrors.tuna.tsinghua.edu.cn/git/pre-commit/pre-commit-hooks.git
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://mirrors.tuna.tsinghua.edu.cn/git/psf/black.git
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://mirrors.tuna.tsinghua.edu.cn/git/pycqa/isort.git
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://mirrors.tuna.tsinghua.edu.cn/git/pycqa/flake8.git
    rev: 6.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  - repo: https://mirrors.tuna.tsinghua.edu.cn/git/pre-commit/mirrors-mypy.git
    rev: v1.3.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports]