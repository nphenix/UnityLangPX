[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unitylangpx"
version = "1.0.0"
description = "基于大模型技术的多平台翻译解决方案"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "UnityLangPX Team"}
]
keywords = ["translation", "ai", "ollama", "markdown"]
dependencies = [
    "requests>=2.28.0",
    "markdown>=3.4.0",
    "aiohttp>=3.8.0",
    "asyncio-throttle>=1.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "toml>=0.10.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "psutil>=5.8.0",
    "pathlib2>=2.3.0",
    "loguru>=0.7.0",
    "rich>=13.0.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
cli = ["tqdm>=4.64.0", "colorama>=0.4.4", "watchdog>=2.1.0"]
dev = ["black>=22.0.0", "isort>=5.10.0", "flake8>=5.0.0", "mypy>=1.0.0"]

[project.scripts]
unitylangpx = "src.cli.main:cli"

[project.urls]
Homepage = "https://gitee.com/unitylangpx/unitylangpx"
Repository = "https://gitee.com/unitylangpx/unitylangpx"
Documentation = "https://unitylangpx.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
